name: Synchronize election polls
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-polls.mjs'
      - '.github/workflows/sync-polls.yml'
  repository_dispatch:
    types: [election-engine-polls-updated]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: votewatch-poll-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import upstream national polls
        run: node scripts/sync-polls.mjs
      - name: Validate before publishing
        run: node scripts/validate-model.mjs
      - name: Commit any polling changes
        id: commit
        run: |
          if git diff --quiet -- data/context.js; then
            echo "No changes detected."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/context.js
          git commit -m "data: synchronize verified and held upstream national polls"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # GITHUB_TOKEN pushes do not trigger separate GitHub Actions workflows.
      # Deploy the newly committed site here only when the polling ledger changed.
      - name: Configure Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - name: Build updated site
        if: steps.commit.outputs.changed == 'true'
        run: node scripts/build.mjs
      - name: Upload updated site
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy updated site
        id: deployment
        if: steps.commit.outputs.changed == 'true'
        uses: actions/deploy-pages@v5
